name: Print Software Versions
on:
  push:
  workflow_dispatch:
jobs:
  PrintLanguageVersions:
    runs-on: ubuntu-latest
    steps:
      - name: Print Java Version
        run: java --version
      - name: Print Maven Version
        run: mvn --version
  PrintDBMSVersions:
    runs-on: ubuntu-latest
    needs: [PrintLanguageVersions]
    steps:
      - name: Print PostgreSQL Version
        run: psql --version
