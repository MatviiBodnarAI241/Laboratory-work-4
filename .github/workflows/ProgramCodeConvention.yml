name: Program Code Convention
on:
  push:
  workflow_dispatch:
jobs:
  ProgramCodeLinter:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code in Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Lint Program Code
        uses: super-linter/super-linter/slim@v7
        env:
          VALIDATE_JAVA: true
          VALIDATE_ALL_CODEBASE: true
          FILTER_REGEX_INCLUDE: .*ProgramCode.*\.java|.*package-info\.java
          JAVA_FILE_NAME: sun_checks.xml
          DEFAULT_BRANCH: main
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
